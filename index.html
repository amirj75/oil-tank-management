let lowStockAudioCtx=null, lowStockAlarmTimer=null;
function playLowStockBeep(){
  try{
    lowStockAudioCtx=lowStockAudioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(lowStockAudioCtx.state==='suspended') lowStockAudioCtx.resume();
    const o=lowStockAudioCtx.createOscillator(),g=lowStockAudioCtx.createGain();
    o.type='square'; o.frequency.value=880; g.gain.setValueAtTime(.0001,lowStockAudioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.055,lowStockAudioCtx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,lowStockAudioCtx.currentTime+.18); o.connect(g);g.connect(lowStockAudioCtx.destination);o.start();o.stop(lowStockAudioCtx.currentTime+.2);
  }catch(e){}
}
function updateLowStockAlarm(){
  const critical=tanks.some(t=>Number(t.stock)<Number(t.capacity)*.15);
  if(critical){
    clearInterval(lowStockAlarmTimer); lowStockAlarmTimer=setInterval(playLowStockBeep,1800);
    setTimeout(playLowStockBeep,250);
  }else{clearInterval(lowStockAlarmTimer);lowStockAlarmTimer=null;}
}

function showOil(){auditMode=false;let cap=tanks.reduce((a,t)=>a+t.capacity,0),stock=tanks.reduce((a,t)=>a+t.stock,0);document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><span>⚙</span> سامانه مدیریت و نگهداری و تعمیرات</div><div class="nav"><button onclick="showHome()">⌂ صفحه اصلی</button><button class="active">🛢️ انبار روغن</button><button onclick="report()">▥ گزارش‌ها</button></div><div class="online"><span class="dot"></span> اتصال به دیتابیس فعال</div></aside><main><div class="top"><div class="title"><h1>نمایش لحظه‌ای مخازن</h1><p>اطلاعات مشترک و آنلاین برای تمام دستگاه‌ها</p></div><div class="clock" id="clock"></div></div><section class="kpis"><div class="kpi"><div class="label">ظرفیت کل</div><div class="value">${fa(cap)} لیتر</div><div class="sub">۴ مخزن</div></div><div class="kpi"><div class="label">موجودی فعلی</div><div class="value">${fa(stock)} لیتر</div><div class="sub">${fa(stock/cap*100)}٪ ظرفیت</div></div><div class="kpi"><div class="label">برداشت امروز</div><div class="value" id="outToday">۰ لیتر</div><div class="sub">ثبت‌شده در سیستم</div></div><div class="kpi"><div class="label">ورود امروز</div><div class="value" id="inToday">۰ لیتر</div><div class="sub">ثبت‌شده در سیستم</div></div></section><section class="tanks">${tanks.map((t,i)=>{let p=t.stock/t.capacity*100;return `<article class="tank-card"><div class="tank-head"><div><div class="tank-name">${esc(t.name)}${p<15?'<span class="low-stock-alarm" title="موجودی کمتر از ۱۵٪"><span class="siren-light"></span>🚨</span>':''}</div><div class="tank-cap">ظرفیت: ${fa(t.capacity)} لیتر</div></div><span class="badge" style="${p<15?'background:#4b0d13;color:#ff8c94;border-color:#8d2029':''}">${p<15?'بحرانی':p<30?'هشدار':'عادی'}</span></div><div class="tank-wrap">${svg(t,i)}<div class="level-text">${fa(t.stock)} لیتر — ${fa(p.toFixed(0))}٪</div></div><div class="stats"><div><div class="percent">موجودی فعلی</div><div class="litre">${fa(t.stock)} لیتر</div></div><div><div class="percent">پرشدگی</div><b>${fa(p.toFixed(1))}%</b></div></div><div class="meter"><i style="width:${p}%;background:${t.color}"></i></div><button class="take" style="background:linear-gradient(90deg,${t.color},#5b430c)" onclick="withdraw(${i})">💧 برداشت از مخزن</button><button class="take" style="margin-top:7px;background:linear-gradient(90deg,#16834b,#0f5c36)" onclick="entry(${t.id})">＋ ورود روغن</button></article>`}).join('')}</section><section class="panels"><div class="panel"><h2>بیشترین مصرف</h2><div id="topConsumption"><div class="hint">در حال دریافت آمار مصرف...</div></div></div><div class="panel"><h2>ده عملیات اخیر</h2><table class="table"><thead><tr><th>نوع</th><th>اپراتور</th><th>مخزن</th><th>مقدار</th><th>زمان</th></tr></thead><tbody>${ops.slice(0,10).map(x=>`<tr class="${x.type==='in'?'operation-in':'operation-out'}"><td>${x.type==='in'?'🟢 ورود':'🔴 برداشت'}</td><td>${esc(x.operator??x.p_operator??x.operator_name??'—')}</td><td>${esc(x.tank_name??'—')}</td><td>${fa(x.amount_l)} لیتر</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">هنوز عملیاتی ثبت نشده است.</td></tr>'}</tbody></table></div></section></main></div>`;updateClock();updateLowStockAlarm();const todayRows=opsToday||[];const normType=x=>String(x.type??x.transaction_type??x.p_type??'').trim().toLowerCase();const out=todayRows.filter(x=>['out','withdrawal','withdraw','برداشت'].includes(normType(x))).reduce((a,x)=>a+Number(x.amount_l??x.amount??0),0),inn=todayRows.filter(x=>['in','entry','deposit','ورود'].includes(normType(x))).reduce((a,x)=>a+Number(x.amount_l??x.amount??0),0);document.getElementById('outToday').textContent=fa(out)+' لیتر';document.getElementById('inToday').textContent=fa(inn)+' لیتر';loadTopConsumption('all');refreshTodayTotals()}
async function refreshTodayTotals(){
  const outEl=document.getElementById('outToday'), inEl=document.getElementById('inToday');
  if(!outEl||!inEl)return;
  try{
    // Fetch transactions directly, then filter by the browser's local calendar day.
    const {data,error}=await sb.from('transactions').select('type,amount_l,created_at').order('created_at',{ascending:false}).limit(5000);
    if(error)throw error;
    const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);
    const end=new Date(start);end.setDate(end.getDate()+1);
    const today=(data||[]).filter(x=>{const d=new Date(x.created_at);return !Number.isNaN(d.getTime())&&d>=start&&d<end;});
    const kind=x=>String(x.type??'').trim().toLowerCase();
    const out=today.filter(x=>kind(x)==='out').reduce((sum,x)=>sum+Number(x.amount_l||0),0);
    const inn=today.filter(x=>kind(x)==='in').reduce((sum,x)=>sum+Number(x.amount_l||0),0);
    // Only update if the oil dashboard is still mounted.
    if(document.getElementById('outToday'))document.getElementById('outToday').textContent=fa(out)+' لیتر';
    if(document.getElementById('inToday'))document.getElementById('inToday').textContent=fa(inn)+' لیتر';
  }catch(err){console.error('خطا در تازه‌سازی برداشت امروز:',err);outEl.title='خطا در دریافت اطلاعات امروز';}
}
async function loadTopConsumption(period='all'){
  const box=document.getElementById('topConsumption');
  if(!box)return;
  let start=null,d=new Date();
  if(period==='monthly')start=new Date(d.getFullYear(),d.getMonth(),1);
  else if(period==='3months'){start=new Date(d);start.setMonth(d.getMonth()-3)}
  else if(period==='6months'){start=new Date(d);start.setMonth(d.getMonth()-6)}
  else if(period==='yearly'){start=new Date(d);start.setFullYear(d.getFullYear()-1)}
  let q=sb.from('transactions').select('*').eq('type','out').order('created_at',{ascending:false});
  if(start)q=q.gte('created_at',start.toISOString());
  let {data:o,error}=await q.limit(5000);
  if(error){box.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}
  o=o||[];
  let rank={};
  o.forEach(x=>{let name=String(x.operator??x.p_operator??x.operator_name??'').trim()||'بدون نام';rank[name]=(rank[name]||0)+Number(x.amount_l||0)});
  let rows=Object.entries(rank).sort((a,b)=>b[1]-a[1]);
  let buttons='<div class="quick" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px">';
  buttons+='<button class="'+(period==='all'?'save':'cancel')+'" onclick="loadTopConsumption(\'all\')">کلی</button>';

function starHTML(score){
  if(score===null || score===undefined || isNaN(score)) return '<span class="star off">☆☆☆☆☆</span>';
  let n=Math.max(0,Math.min(5,Math.round(Number(score)/20)));
  return '<span class="star">'+'★'.repeat(n)+'</span><span class="star off">'+'☆'.repeat(5-n)+'</span>';
}
function auditScore(inspections){
  if(!inspections.length) return null;
  const weights={'نظافت بدنه':5,'نظافت اطراف':5,'عدم بررسی':20,'چک روغن':8,'خرابی آب صابون':10,'نشتی':12,'خرابی تجهیز':15,'سایر':10};
  let penalty=0;
  inspections.forEach(x=>(x.nonconformities||[]).forEach(n=>penalty+=(weights[n.type||n]||10)));
  return Math.max(0,Math.min(100,100-(penalty/inspections.length)));
}

async function compressAuditPhoto(file){
  if(!file || !file.type || !file.type.startsWith('image/')) return file;
  // عکس‌های کوچک‌تر از 1MB را بدون افت کیفیت دوباره‌فشرده نمی‌کنیم.
  const MAX_BYTES=1200*1024, MAX_DIM=1600;
  if(file.size<=MAX_BYTES && file.type==='image/jpeg') return file;
  try{
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,MAX_DIM/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale)), h=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.drawImage(bitmap,0,0,w,h);
    if(bitmap.close) bitmap.close();
    let quality=0.82, blob=null;
    for(let i=0;i<5;i++){
      blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(!blob || blob.size<=MAX_BYTES || quality<=0.58) break;
      quality-=0.06;
    }
    if(!blob) return file;
    const base=(file.name||'inspection-photo').replace(/\.[^.]+$/,'');
    return new File([blob],`${base}.jpg`,{type:'image/jpeg',lastModified:Date.now()});
  }catch(e){
    console.warn('فشرده‌سازی عکس انجام نشد؛ فایل اصلی استفاده می‌شود.',e);
    return file;
  }
}
async function saveAudit(equipmentId){
  const e=auditEquip.find(x=>String(x.id)===String(equipmentId));
  if(!e){const er0=document.getElementById('auditErr'); if(er0) er0.textContent='تجهیز پیدا نشد.'; return} const o=auditOps.find(x=>String(x.id)===String(e.operator_id));
  const err=document.getElementById('auditErr'), note=document.getElementById('auditNote').value.trim();
  let ncs=[...document.querySelectorAll('#ncArea input:checked')].map(x=>x.value);
  if(window.auditResult==='nc'&&!ncs.length){err.textContent='حداقل یک عدم انطباق را انتخاب کنید.';return}
  let photo_url=null;
  if(selectedPhotoFile){
    err.textContent='در حال آماده‌سازی و فشرده‌سازی عکس…';
    const uploadFile=await compressAuditPhoto(selectedPhotoFile);
    const ext=(uploadFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${o.id}/${e.id}/${Date.now()}.${ext||'jpg'}`;
    const up=await sb.storage.from('inspection-photos').upload(path,uploadFile,{upsert:false,contentType:uploadFile.type||'image/jpeg'});
    if(up.error){err.textContent='آپلود عکس انجام نشد: '+up.error.message;return}
    photo_url=sb.storage.from('inspection-photos').getPublicUrl(path).data.publicUrl;

  const ins={equipment_id:e.id,operator_id:o.id,result:window.auditResult,note,photo_url};
  const {data,error}=await sb.from('audit_inspections').insert(ins).select().single();

}

<style>
.voice-btn{position:fixed;bottom:20px;left:20px;z-index:99999;background:linear-gradient(135deg,#18a8ff,#0b61a4);color:#fff;border:0;border-radius:50%;width:60px;height:60px;font-size:28px;box-shadow:0 10px 25px #0008;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s}
.voice-btn.recording{background:linear-gradient(135deg,#ff3948,#b5121b);animation:voicePulse 1s infinite}
.voice-status{position:fixed;bottom:90px;left:20px;z-index:99999;max-width:min(340px,calc(100vw - 40px));padding:10px 14px;border:1px solid #354554;border-radius:12px;background:#111820;color:#f3f6f8;font:12px/1.9 Vazirmatn,Tahoma,sans-serif;box-shadow:0 8px 25px #0008;display:none;direction:rtl}
.voice-status.show{display:block}.voice-status.error{border-color:#b5121b}.voice-modal-content{direction:rtl;text-align:right;font:13px/2 Vazirmatn,Tahoma,sans-serif;color:#e7edf3}.voice-modal-content b{color:#64c7ff}
@keyframes voicePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media(max-width:600px){.voice-btn{bottom:15px;left:15px;width:56px;height:56px}.voice-status{bottom:80px;left:15px}}
</style>
<div id="voiceStatus" class="voice-status" role="status" aria-live="polite"></div>
<button id="voiceBtn" class="voice-btn" type="button" onclick="toggleVoice()" title="دستیار صوتی" aria-label="شروع دستیار صوتی">🎤</button>
<script>
(function(){
  'use strict';
  let isRecording=false, recognition=null, pendingVoiceCommand=null;
  const voiceStatus=document.getElementById('voiceStatus');
  const faNum=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:2});
  function voiceMessage(message,isError=false,speak=false){
    if(voiceStatus){voiceStatus.textContent=message;voiceStatus.classList.add('show');voiceStatus.classList.toggle('error',!!isError);}
    if(speak) speakPersian(message);
  }
  function speakPersian(text){
    if(!('speechSynthesis' in window)) return;
    try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='fa-IR';u.rate=.94;u.pitch=1;window.speechSynthesis.speak(u);}catch(e){console.warn('TTS unavailable',e);}
  }
  function normalizeFa(text){
    return String(text||'').toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim();
  }
  function findTankInText(text){
    const q=normalizeFa(text);
    if(!Array.isArray(tanks)) return null;
    return tanks.find(t=>normalizeFa(t.name).split(/\s+/).some(w=>w.length>1&&q.includes(w)))||null;
  }
  function answerLocalQuestion(transcript){
    const q=normalizeFa(transcript);
    if(!Array.isArray(tanks)||!tanks.length) return false;
    const isQuestion=/(چقدر|موجودی|وضعیت|چند لیتر|لیست مخزن|مخزن ها|مخزنها|مخزن‌ها|آخرین تراکنش|آخرین ورود|آخرین برداشت|مصرف امروز|تراکنش امروز|گزارش امروز)/.test(q);
    if(!isQuestion) return false;
    const tank=findTankInText(q);
    if(/آخرین تراکنش|آخرین ورود|آخرین برداشت|تراکنش امروز|گزارش امروز|مصرف امروز/.test(q)){
      const rows=Array.isArray(ops)?ops:[];
      const today=/امروز|مصرف امروز/.test(q);
      const filtered=rows.filter(r=>{
        const type=normalizeFa(r.type||r.transaction_type||'');
        const date=new Date(r.created_at||0);
        const localToday=new Date();localToday.setHours(0,0,0,0);
        const isToday=date>=localToday;
        const typeOk=/آخرین ورود/.test(q)?type==='in':(/آخرین برداشت|مصرف امروز/.test(q)?type==='out':true);
        return typeOk&&(!today||isToday)&&(!tank||String(r.tank_id)===String(tank.id));
      }).slice(0,5);
      if(!filtered.length){const msg='تراکنشی مطابق این درخواست در اطلاعات بارگذاری‌شده پیدا نشد.';voiceMessage(msg,false,true);return true;}
      const lines=filtered.slice(0,3).map(r=>{
        const t=tanks.find(x=>String(x.id)===String(r.tank_id));
        const typ=normalizeFa(r.type||r.transaction_type)==='in'?'ورود':'برداشت';
        const dt=r.created_at?new Date(r.created_at).toLocaleString('fa-IR'):'زمان نامشخص';
        return `${typ} ${faNum(r.amount_l||r.amount||0)} لیتر، ${t?t.name:'مخزن نامشخص'}، ${dt}`;
      });
      const msg=lines.join('؛ ');voiceMessage(msg,false,true);return true;
    }
    if(tank){
      const pct=tank.capacity>0?Math.round(tank.stock/tank.capacity*100):0;
      const msg=`موجودی ${tank.name} برابر ${faNum(tank.stock)} لیتر از ظرفیت ${faNum(tank.capacity)} لیتر است؛ حدود ${faNum(pct)} درصد ظرفیت.`;
      voiceMessage(msg,false,true);return true;
    }
    if(/لیست مخزن|مخزن ها|مخزنها|مخزن‌ها/.test(q)){
      const msg=tanks.map(t=>`${t.name}: ${faNum(t.stock)} لیتر`).join('؛ ');
      voiceMessage(msg,false,true);return true;
    }
    const total=tanks.reduce((sum,t)=>sum+Number(t.stock||0),0);
    const cap=tanks.reduce((sum,t)=>sum+Number(t.capacity||0),0);
    const msg=`مجموع موجودی ${faNum(total)} لیتر است؛ ظرفیت کل مخازن ${faNum(cap)} لیتر.`;
    voiceMessage(msg,false,true);return true;
  }
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    recognition=new SpeechRecognition();
    recognition.lang='fa-IR';recognition.interimResults=false;recognition.maxAlternatives=1;
    recognition.onstart=function(){isRecording=true;document.getElementById('voiceBtn').classList.add('recording');voiceMessage('گوش می‌دهم؛ دستور یا سؤال را بیان کنید.');};
    recognition.onresult=async function(event){
      const transcript=event.results?.[0]?.[0]?.transcript||'';
      if(!transcript.trim()){voiceMessage('صدایی تشخیص داده نشد. دوباره تلاش کنید.',true,true);return;}
      voiceMessage(`شنیده شد: «${transcript}» — در حال بررسی...`);
      try{
        if(answerLocalQuestion(transcript)) return;
        const {data:{session}}=await sb.auth.getSession();
        if(!session){voiceMessage('برای استفاده از دستیار صوتی ابتدا وارد حساب کاربری شوید.',true,true);return;}
        const response=await fetch(CONFIG.url+'/functions/v1/parse-oil-voice',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':CONFIG.key},
          body:JSON.stringify({transcript})
        });
        let result={};
        try{result=await response.json();}catch(_){}
        if(!response.ok) throw new Error(result.error||result.message||`خطا در پردازش فرمان (${response.status})`);
        if(!result||!['in','out'].includes(result.intent)){voiceMessage('فرمان را به‌عنوان ورود یا برداشت روغن تشخیص ندادم. واضح‌تر بیان کنید.',true,true);return;}
        showVoiceConfirmDialog(result,transcript);
      }catch(err){console.error('Voice assistant:',err);voiceMessage(err.message||'خطا در ارتباط با دستیار صوتی.',true,true);}
    };
    recognition.onerror=function(event){
      const messages={ 'not-allowed':'دسترسی میکروفون داده نشده است. مجوز میکروفون مرورگر را بررسی کنید.','no-speech':'صدایی دریافت نشد؛ دوباره روی میکروفون بزنید.','network':'خطای شبکه در تشخیص صدا.','audio-capture':'میکروفون پیدا نشد.'};
      voiceMessage(messages[event.error]||'خطا در دریافت صدا. دوباره تلاش کنید.',true,true);
      resetVoiceBtn();
    };
    recognition.onend=resetVoiceBtn;
  }else{
    voiceMessage('این مرورگر تشخیص گفتار را پشتیبانی نمی‌کند. از نسخه جدید Chrome یا Edge استفاده کنید.',true);
  }
  function resetVoiceBtn(){isRecording=false;const b=document.getElementById('voiceBtn');if(b)b.classList.remove('recording');}
  window.toggleVoice=function(){
    if(!recognition){voiceMessage('تشخیص گفتار در این مرورگر در دسترس نیست.',true,true);return;}
    try{if(isRecording)recognition.stop();else recognition.start();}catch(e){voiceMessage('میکروفون در حال استفاده است یا آماده نیست؛ کمی بعد دوباره تلاش کنید.',true);}
  };
  function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  window.showVoiceConfirmDialog=function(data,transcript){
    pendingVoiceCommand=data;
    const intentText=data.intent==='in'?'ورود روغن':'برداشت روغن';
    const items=[
      ['فرمان شنیده‌شده',transcript||'—'],
      ['عملیات',intentText],
      ['مخزن',data.tank_name||'مشخص نشده'],
      ['مقدار',data.amount_l?`${faNum(data.amount_l)} لیتر`:'مشخص نشده'],
      ['اپراتور',data.operator_name||'ثبت صوتی'],
      ['کد تجهیز',data.equipment_code||'ثبت نشده']
    ];
    const html=`<h2>تأیید دستور صوتی</h2><div class="hint">قبل از ثبت، اطلاعات را بررسی کنید.</div><div class="voice-modal-content">${items.map(([k,v])=>`<div><b>${safeText(k)}:</b> ${safeText(v)}</div>`).join('')}</div><div class="error" id="voiceConfirmError"></div><div class="actions"><button type="button" class="cancel" onclick="closeM()">لغو</button><button type="button" class="save" id="voiceConfirmBtn" onclick="executeVoiceCommand()">تأیید و ثبت</button></div>`;
    dialog(html);
  };
  window.executeVoiceCommand=async function(){
    const data=pendingVoiceCommand;
    const errEl=document.getElementById('voiceConfirmError');
    const btn=document.getElementById('voiceConfirmBtn');
    const fail=msg=>{if(errEl)errEl.textContent=msg;};
    if(!data){fail('فرمان معتبری برای ثبت وجود ندارد.');return;}
    const tank=Array.isArray(tanks)?tanks.find(t=>normalizeFa(t.name)===normalizeFa(data.tank_name)||normalizeFa(t.name).includes(normalizeFa(data.tank_name||'!'))||normalizeFa(data.tank_name||'').includes(normalizeFa(t.name))):null;
    if(!tank){fail('مخزن تشخیص داده‌شده در فهرست مخازن پیدا نشد.');return;}
    const amount=Number(data.amount_l);
    if(!Number.isFinite(amount)||amount<=0){fail('مقدار روغن معتبر نیست.');return;}
    if(data.intent==='out'&&amount>Number(tank.stock)){fail(`موجودی مخزن کافی نیست؛ موجودی فعلی ${faNum(tank.stock)} لیتر است.`);return;}
    if(btn){btn.disabled=true;btn.textContent='در حال ثبت...';}
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session)throw new Error('نشست ورود منقضی شده است؛ دوباره وارد شوید.');
      const {error}=await sb.rpc('record_stock_transaction',{
        p_tank_id:tank.id,p_type:data.intent,p_amount_l:amount,
        p_operator:String(data.operator_name||'ثبت صوتی').slice(0,120),
        p_equipment:data.equipment_code?String(data.equipment_code).slice(0,120):null
      });
      if(error)throw error;
      closeM();pendingVoiceCommand=null;
      await load();
      voiceMessage(`${data.intent==='in'?'ورود':'برداشت'} ${faNum(amount)} لیتر برای ${tank.name} با موفقیت ثبت شد.`,false,true);
    }catch(e){console.error(e);fail(e.message||'ثبت عملیات ناموفق بود.');}
    finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='تأیید و ثبت';}}
  };
})();
</script>
</body></html>
