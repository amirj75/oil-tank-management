<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه مدیریت مخازن روغن</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#04101b;color:#edf7ff;min-height:100vh}
:root{--line:#17364d;--muted:#88a4b9}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#071a2b,#03101b);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;padding:8px 8px 22px}.logo span{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd63f,#e98b00);color:#07131e;font-size:20px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:#a8bfd0;padding:12px 13px;border-radius:12px;text-align:right;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#0a5a91,#0a2f4d);color:#fff;border-color:#1c618c}.online{position:absolute;bottom:18px;right:18px;left:18px;border-top:1px solid var(--line);padding-top:14px;color:#88a5ba;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#25d27d;margin-left:6px}
main{padding:23px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:24px}.title p{margin:5px 0;color:var(--muted);font-size:12px}.clock{background:#081c2d;border:1px solid var(--line);padding:9px 12px;border-radius:11px;color:#aac1d2;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:linear-gradient(145deg,#0a2133,#061624);border:1px solid var(--line);border-radius:15px;padding:14px}.kpi .label{color:#8ca7bb;font-size:11px}.kpi .value{font-size:22px;font-weight:800;margin-top:5px}.kpi .sub{font-size:10px;color:#6d899f;margin-top:3px}.tanks{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:14px}.tank-card{background:linear-gradient(160deg,#0a1e30,#061522);border:1px solid #193b55;border-radius:17px;padding:13px;overflow:hidden;box-shadow:0 15px 42px #0006}.tank-head{display:flex;justify-content:space-between}.tank-name{font-weight:800}.tank-cap{font-size:10px;color:#7f9db3;margin-top:3px}.badge{font-size:10px;padding:4px 7px;border-radius:20px;background:#0c2a40;color:#a9c6d8}.tank-wrap{height:305px;display:flex;align-items:center;justify-content:center;position:relative}.tank-svg{width:100%;height:100%;max-width:235px}.level-text{position:absolute;bottom:14px;right:50%;transform:translateX(50%);background:#06131ee8;border:1px solid #31536d;padding:6px 10px;border-radius:10px;font-weight:700;font-size:12px}.stats{display:flex;justify-content:space-between;background:#071a2a;border:1px solid #17354d;border-radius:12px;padding:9px 11px}.litre{font-size:17px;font-weight:800}.percent{font-size:10px;color:#9ab1c1}.meter{height:5px;background:#122a3c;border-radius:9px;overflow:hidden;margin:9px 0}.meter i{display:block;height:100%;border-radius:9px;transition:width .8s}.take{width:100%;border:0;border-radius:11px;padding:11px;color:#fff;font:700 13px Vazirmatn;cursor:pointer}.panels{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:15px}.panel{background:#071a2a;border:1px solid var(--line);border-radius:17px;padding:15px}.panel h2{font-size:15px;margin:0 0 11px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{border:1px solid #214660;background:#0a2235;color:#dcecf7;border-radius:11px;padding:11px;font:600 12px Vazirmatn;cursor:pointer}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px;border-bottom:1px solid #153049;text-align:right}.table th{color:#7f9bb0}.empty{text-align:center;color:#6f899e;padding:17px}.in-row{color:#35e58a;font-weight:700}.out-row{color:#ff6262;font-weight:700}.report-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.report-tabs button{border:1px solid #214660;background:#0a2235;color:#dcecf7;border-radius:10px;padding:8px 12px;font:600 11px Vazirmatn;cursor:pointer}.report-box{margin-top:10px;max-height:330px;overflow:auto;border:1px solid #17354d;border-radius:11px}
.modal{position:fixed;inset:0;background:#020912b8;display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(7px)}.modal.show{display:flex}.dialog{width:min(470px,100%);background:linear-gradient(145deg,#0b2236,#06131f);border:1px solid #28516d;border-radius:19px;padding:19px;box-shadow:0 30px 90px #000c}.dialog h2{margin:0 0 4px;font-size:18px}.hint{color:#7996aa;font-size:11px;margin-bottom:13px}.field{margin:10px 0}.field label{display:block;color:#aac0cf;font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#081b2c;border:1px solid #24465f;color:#fff;border-radius:10px;padding:10px;font:inherit}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font:700 12px Vazirmatn;cursor:pointer}.cancel{background:#183148;color:#bfd2df}.save{background:#0b9bef;color:#fff}.error{color:#ff7373;font-size:11px;min-height:17px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#0c3150,#04101b 55%)}.loginbox{width:min(410px,92%);background:#081b2b;border:1px solid #214660;border-radius:20px;padding:25px;box-shadow:0 25px 80px #0009}.loginbox h1{font-size:20px;margin:0 0 5px}.loginbox p{font-size:11px;color:#86a2b7;margin:0 0 18px}.logout{margin-top:15px;width:100%;padding:10px;border:1px solid #254963;background:#0a2033;color:#c9d9e5;border-radius:10px;font:600 12px Vazirmatn;cursor:pointer}
@media(max-width:1100px){.tanks{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.sidebar{height:auto;position:relative;padding:9px;border-left:0;border-bottom:1px solid var(--line)}.logo{padding:3px 7px 9px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.online{display:none}main{padding:12px}.clock{display:none}.tanks{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const CONFIG={url:"https://blnusmzbbdkwelqdawjj.supabase.co",key:"sb_publishable_yQuyHvsHby0YibxTcUQD9Q_Axwxg56h"};
const sb=supabase.createClient(CONFIG.url,CONFIG.key);
const colors=['#c5d629','#5a3828','#d88b12','#f2bd20'];
let tanks=[],ops=[],modal=document.getElementById('modal');
const fa=n=>Number(n).toLocaleString('fa-IR'); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function svg(t,i){const p=Math.max(0,Math.min(100,t.stock_1/t.capacity*100)),y=302-p*2.05,u='g'+i;return `<svg class="tank-svg" viewBox="0 0 250 340"><defs><linearGradient id="${u}m"><stop stop-color="#4b5964"/><stop offset=".2" stop-color="#e4ebef"/><stop offset=".38" stop-color="#65727d"/><stop offset=".58" stop-color="#f5f8fa"/><stop offset=".78" stop-color="#65727d"/><stop offset="1" stop-color="#26323b"/></linearGradient><linearGradient id="${u}l" x2="0" y2="1"><stop stop-color="${t.color}"/><stop offset="1" stop-color="${t.color}" stop-opacity=".55"/></linearGradient><clipPath id="${u}c"><rect x="47" y="85" width="156" height="218" rx="29"/></clipPath></defs><ellipse cx="125" cy="313" rx="91" ry="12" fill="#000" opacity=".45"/><path d="M63 92Q63 62 91 51h68q28 11 28 41l14 10v190q0 21-20 21H69q-20 0-20-21V102Z" fill="url(#${u}m)" stroke="#b9c5cc" stroke-width="2"/><rect x="47" y="85" width="156" height="218" rx="29" fill="#07131d" stroke="#d0d9df" stroke-width="3"/><g clip-path="url(#${u}c)"><rect x="47" y="${y}" width="156" height="${303-y}" fill="url(#${u}l)"/><path d="M35 ${y}Q65 ${y-9} 95 ${y}T155 ${y}T215 ${y}" fill="none" stroke="${t.color}" stroke-width="5"><animate attributeName="d" dur="3s" repeatCount="indefinite" values="M35 ${y}Q65 ${y-9} 95 ${y}T155 ${y}T215 ${y};M35 ${y}Q65 ${y+8} 95 ${y}T155 ${y+8}T215 ${y};M35 ${y}Q65 ${y-9} 95 ${y}T155 ${y}T215 ${y}"/></path></g><ellipse cx="125" cy="51" rx="34" ry="10" fill="#9aa6ae" stroke="#e4eaee" stroke-width="2"/><rect x="99" y="34" width="52" height="17" rx="7" fill="url(#${u}m)" stroke="#d9e0e5" stroke-width="2"/><path d="M78 85V66L62 55" fill="none" stroke="#bcc7cd" stroke-width="6"/><circle cx="61" cy="54" r="5" fill="#7c8992"/><path d="M202 105h17v180h-17M219 110h12M219 145h8M219 180h12M219 215h8M219 250h12M219 285h12" fill="none" stroke="#d2d9de" stroke-width="2"/><path d="M48 246H34v18h14" fill="none" stroke="#aebac2" stroke-width="4"/><circle cx="29" cy="264" r="7" fill="${t.color}"/></svg>`}
function render(){let cap=tanks.reduce((a,t)=>a+t.capacity_1,0),stock=tanks.reduce((a,t)=>a+t.stock,0);document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><span>⚙</span> سامانه مدیریت مخازن روغن</div><div class="nav"><button class="active">⌂ داشبورد</button><button onclick="withdraw()">♢ برداشت</button><button onclick="entry()">＋ ورود روغن</button><button onclick="report()">▥ گزارش‌ها</button><button>♙ کاربران</button><button>⚙ تنظیمات</button></div><div class="online"><span class="dot"></span> اتصال به دیتابیس فعال</div></aside><main><div class="top"><div class="title"><h1>نمایش لحظه‌ای مخازن</h1><p>اطلاعات مشترک و آنلاین برای تمام دستگاه‌ها</p></div><div class="clock" id="clock"></div></div><section class="kpis"><div class="kpi"><div class="label">ظرفیت کل</div><div class="value">${fa(cap)} L</div><div class="sub">۴ مخزن</div></div><div class="kpi"><div class="label">موجودی فعلی</div><div class="value">${fa(stock)} L</div><div class="sub">${fa(stock/cap*100)}٪ ظرفیت</div></div><div class="kpi"><div class="label">برداشت امروز</div><div class="value" id="outToday">۰ L</div><div class="sub">ثبت‌شده در سیستم</div></div><div class="kpi"><div class="label">ورود امروز</div><div class="value" id="inToday">۰ L</div><div class="sub">ثبت‌شده در سیستم</div></div></section><section class="tanks">${tanks.map((t,i)=>{let p=t.stock/t.capacity*100;return `<article class="tank-card"><div class="tank-head"><div><div class="tank-name">${esc(t.name)}</div><div class="tank-cap">ظرفیت: ${fa(t.capacity)} لیتر</div></div><span class="badge">${p<15?'بحرانی':p<30?'هشدار':'عادی'}</span></div><div class="tank-wrap">${svg(t,i)}<div class="level-text">${fa(t.stock)} لیتر — ${fa(p.toFixed(0))}٪</div></div><div class="stats"><div><div class="percent">موجودی فعلی</div><div class="litre">${fa(t.stock)} L</div></div><div><div class="percent">پرشدگی</div><b>${fa(p.toFixed(1))}%</b></div></div><div class="meter"><i style="width:${p}%;background:${t.color}"></i></div><button class="take" style="background:linear-gradient(90deg,${t.color},#5b430c)" onclick="withdraw(${i})">💧 برداشت از مخزن</button></article>`}).join('')}</section><section class="panels"><div class="panel"><h2>عملیات سریع</h2><div class="quick"><button onclick="entry()">＋ ورود روغن به مخزن</button><button onclick="withdraw()">− ثبت برداشت</button><button onclick="report()">▥ گزارش‌ها</button></div></div><div class="panel"><h2>آخرین عملیات</h2><table class="table"><thead><tr><th>نوع</th><th>مخزن</th><th>مقدار</th><th>زمان</th></tr></thead><tbody>${ops.slice(0,7).map(x=>`<tr><td class="${x.type==='in'?'in-row':'out-row'}">${x.type==='in'?'ورود روغن':'خروج روغن'}</td><td>${esc(x.tank_name)}</td><td class="${x.type==='in'?'in-row':'out-row'}">${x.type==='in'?'+':'−'}${fa(x.amount_l)} L</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">هنوز عملیاتی ثبت نشده است.</td></tr>'}</tbody></table></div></section></main></div>`}
async function load(){const {data:t,error:e}=await sb.from('tanks').select('*').order('id');if(e){alert('اتصال به دیتابیس تنظیم نشده یا خطا دارد.');return}tanks=t.map((x,i)=>({...x,color:colors[i]}));const {data:o}=await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(500);ops=o||[];render();const today=new Date();today.setHours(0,0,0,0);let out=ops.filter(x=>x.type==='out'&&new Date(x.created_at)>=today).reduce((a,x)=>a+x.amount_l,0),inn=ops.filter(x=>x.type==='in'&&new Date(x.created_at)>=today).reduce((a,x)=>a+x.amount_l,0);document.getElementById('outToday').textContent=fa(out)+' L';document.getElementById('inToday').textContent=fa(inn)+' L'}
async function entry(){let opts=tanks.map((t,i)=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');dialog(`<h2>＋ ورود روغن به مخزن</h2><div class="hint">نوع روغن و مقدار ورودی را انتخاب کنید.</div><div class="field"><label>نوع روغن / مخزن</label><select id="ti">${opts}</select></div><div class="field"><label>مقدار ورود (لیتر)</label><input id="ia" type="number" min="1"></div><div class="error" id="er"></div><div class="actions"><button class="cancel" onclick="closeM()">انصراف</button><button class="save" onclick="saveIn()">✓ ثبت ورود</button></div>`)}
async function saveIn(){let id=+document.getElementById('ti').value,a=Number(document.getElementById('ia').value),t=tanks.find(x=>x.id===id),er=document.getElementById('er');if(a<=0){er.textContent='مقدار را وارد کنید.';return}if(t.stock+a>t.capacity){er.textContent='از ظرفیت مخزن بیشتر می‌شود.';return}let {error}=await sb.rpc('record_stock_transaction',{p_tank_id:id,p_type:'in',p_amount_l:a,p_operator:'ورود انبار',p_equipment:null});if(error){er.textContent=error.message;return}closeM();load()}
async function withdraw(index=0){let opts=tanks.map((t,i)=>`<option value="${t.id}" ${i===index?'selected':''}>${esc(t.name)} — ${fa(t.stock)} لیتر</option>`).join('');dialog(`<h2>ثبت برداشت از مخزن</h2><div class="hint">تاریخ و ساعت خودکار ثبت می‌شود.</div><div class="field"><label>مخزن</label><select id="wi">${opts}</select></div><div class="field"><label>نام اپراتور</label><input id="op"></div><div class="field"><label>کد تجهیز</label><input id="eq"></div><div class="field"><label>میزان برداشت (لیتر)</label><input id="wa" type="number" min="1"></div><div class="error" id="er"></div><div class="actions"><button class="cancel" onclick="closeM()">انصراف</button><button class="save" onclick="saveOut()">✓ ثبت برداشت</button></div>`)}
async function saveOut(){let id=+document.getElementById('wi').value,a=Number(document.getElementById('wa').value),op=document.getElementById('op').value.trim(),eq=document.getElementById('eq').value.trim(),er=document.getElementById('er'),t=tanks.find(x=>x.id===id);if(!op||!eq||a<=0){er.textContent='اطلاعات را کامل وارد کنید.';return}if(a>t.stock){er.textContent='موجودی کافی نیست.';return}let {error}=await sb.rpc('record_stock_transaction',{p_tank_id:id,p_type:'out',p_amount_l:a,p_operator:op,p_equipment:eq});if(error){er.textContent=error.message;return}closeM();load()}
function report(){dialog(`<h2>گزارش عملیات</h2><div class="hint">ورود و برداشت روغن جداگانه نمایش داده می‌شوند.</div><div class="report-tabs"><button onclick="reportData('daily')">روزانه</button><button onclick="reportData('weekly')">هفتگی</button><button onclick="reportData('monthly')">ماهانه</button><button onclick="reportData('quarterly')">۳ ماهه</button><button onclick="reportData('6months')">۶ ماهه</button><button onclick="reportData('yearly')">۱ ساله</button></div><div class="report-tabs"><button onclick="showReportType('all')">همه</button><button onclick="showReportType('in')">🟢 ورود روغن</button><button onclick="showReportType('out')">🔴 برداشت روغن</button></div><div id="rb"></div><div class="actions"><button class="cancel" onclick="closeM()">بستن</button></div>`)}
let currentReport=[];
function showReportType(type){let o=type==='all'?currentReport:currentReport.filter(x=>x.type===type),inn=o.filter(x=>x.type==='in').reduce((a,x)=>a+Number(x.amount_l),0),out=o.filter(x=>x.type==='out').reduce((a,x)=>a+Number(x.amount_l),0);document.getElementById('rb').innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px"><div class="kpi"><div class="label">ورود روغن</div><div class="value in-row">${fa(inn)} L</div></div><div class="kpi"><div class="label">برداشت روغن</div><div class="value out-row">${fa(out)} L</div></div><div class="kpi"><div class="label">تعداد عملیات</div><div class="value">${fa(o.length)}</div></div></div><div class="report-box"><table class="table"><thead><tr><th>نوع</th><th>مخزن</th><th>مقدار</th><th>اپراتور</th><th>تجهیز</th><th>زمان</th></tr></thead><tbody>${o.map(x=>`<tr><td class="${x.type==='in'?'in-row':'out-row'}">${x.type==='in'?'ورود روغن':'برداشت روغن'}</td><td>${esc(x.tank_name||'')}</td><td class="${x.type==='in'?'in-row':'out-row'}">${x.type==='in'?'+':'−'}${fa(x.amount_l)} L</td><td>${esc(x.operator||'')}</td><td>${esc(x.equipment||'')}</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">موردی ثبت نشده است.</td></tr>'}</tbody></table></div>`}
async function reportData(p){let d=new Date(),start=new Date(d);if(p==='daily')start.setHours(0,0,0,0);if(p==='weekly'){start.setDate(d.getDate()-6);start.setHours(0,0,0,0)}if(p==='monthly'){start.setDate(1);start.setHours(0,0,0,0)}if(p==='quarterly')start.setMonth(d.getMonth()-3);if(p==='6months')start.setMonth(d.getMonth()-6);if(p==='yearly')start.setFullYear(d.getFullYear()-1);let {data:o,error}=await sb.from('transactions').select('*').gte('created_at',start.toISOString()).order('created_at',{ascending:false});if(error){document.getElementById('rb').innerHTML=`<div class="error">${esc(error.message)}</div>`;return}currentReport=o||[];showReportType('all')}
function dialog(h){document.getElementById('dialog').innerHTML=h;modal.classList.add('show')}function closeM(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeM()});function tick(){let c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString('fa-IR',{dateStyle:'full',timeStyle:'medium'})}setInterval(tick,1000);tick();
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>سامانه مدیریت مخازن روغن</h1><p>برای ورود، ایمیل و رمز عبور کاربر سامانه را وارد کنید.</p><div class="field"><label>ایمیل</label><input id="em" type="email"></div><div class="field"><label>رمز عبور</label><input id="pw" type="password"></div><div class="error" id="le"></div><button class="save" style="width:100%;padding:11px;border:0;border-radius:10px;font:700 12px Vazirmatn;cursor:pointer" onclick="login()">ورود به سامانه</button></div></div>`}else load()}
async function login(){let e=document.getElementById('em').value,p=document.getElementById('pw').value,r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)document.getElementById('le').textContent='ایمیل یا رمز عبور صحیح نیست.';else load()}
boot();
</script></body></html>
