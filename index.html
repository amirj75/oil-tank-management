function showOil(){let cap=tanks.reduce((a,t)=>a+t.capacity,0),stock=tanks.reduce((a,t)=>a+t.stock,0);document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><span>⚙</span> سامانه مدیریت و نگهداری و تعمیرات</div><div class="nav"><button onclick="showHome()">⌂ صفحه اصلی</button><button class="active">🛢️ انبار روغن</button><button onclick="auditHome()">☑️ چک‌لیست تجهیزات</button><button onclick="report()">▥ گزارش‌ها</button></div><div class="online"><span class="dot"></span> اتصال به دیتابیس فعال</div></aside><main><div class="top"><div class="title"><h1>نمایش لحظه‌ای مخازن</h1><p>اطلاعات مشترک و آنلاین برای تمام دستگاه‌ها</p></div><div class="clock" id="clock"></div></div><section class="kpis"><div class="kpi"><div class="label">ظرفیت کل</div><div class="value">${fa(cap)} L</div><div class="sub">۴ مخزن</div></div><div class="kpi"><div class="label">موجودی فعلی</div><div class="value">${fa(stock)} L</div><div class="sub">${fa(stock/cap*100)}٪ ظرفیت</div></div><div class="kpi"><div class="label">برداشت امروز</div><div class="value" id="outToday">۰ L</div><div class="sub">ثبت‌شده در سیستم</div></div><div class="kpi"><div class="label">ورود امروز</div><div class="value" id="inToday">۰ L</div><div class="sub">ثبت‌شده در سیستم</div></div></section><section class="tanks">${tanks.map((t,i)=>{let p=t.stock/t.capacity*100;return `<article class="tank-card"><div class="tank-head"><div><div class="tank-name">${esc(t.name)}</div><div class="tank-cap">ظرفیت: ${fa(t.capacity)} لیتر</div></div><span class="badge">${p<15?'بحرانی':p<30?'هشدار':'عادی'}</span></div><div class="tank-wrap">${svg(t,i)}<div class="level-text">${fa(t.stock)} لیتر — ${fa(p.toFixed(0))}٪</div></div><div class="stats"><div><div class="percent">موجودی فعلی</div><div class="litre">${fa(t.stock)} L</div></div><div><div class="percent">پرشدگی</div><b>${fa(p.toFixed(1))}%</b></div></div><div class="meter"><i style="width:${p}%;background:${t.color}"></i></div><button class="take" style="background:linear-gradient(90deg,${t.color},#5b430c)" onclick="withdraw(${i})">💧 برداشت از مخزن</button></article>`}).join('')}</section><section class="panels"><div class="panel"><h2>عملیات سریع</h2><div class="quick"><button onclick="entry()">＋ ورود روغن به مخزن</button><button onclick="withdraw()">− ثبت برداشت</button><button onclick="report()">▥ گزارش‌ها</button></div></div><div class="panel"><h2>آخرین عملیات</h2><table class="table"><thead><tr><th>نوع</th><th>مخزن</th><th>مقدار</th><th>زمان</th></tr></thead><tbody>${ops.slice(0,7).map(x=>`<tr><td>${x.type==='in'?'ورود':'برداشت'}</td><td>${esc(x.tank_name)}</td><td>${fa(x.amount_l)} L</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">هنوز عملیاتی ثبت نشده است.</td></tr>'}</tbody></table></div></section></main></div>`;updateClock();document.getElementById('outToday').textContent=fa(ops.filter(x=>x.type==='out'&&new Date(x.created_at).toDateString()===new Date().toDateString()).reduce((a,x)=>a+x.amount_l,0))+' L';document.getElementById('inToday').textContent=fa(ops.filter(x=>x.type==='in'&&new Date(x.created_at).toDateString()===new Date().toDateString()).reduce((a,x)=>a+x.amount_l,0))+' L'}
async function load(){const {data:t,error:e}=await sb.from('tanks').select('*').order('id');if(e){alert('اتصال به دیتابیس تنظیم نشده یا خطا دارد.');return}tanks=t.map((x,i)=>({...x,stock:Number(x.stock_l||0),capacity:Number(x.capacity_l||0),color:colors[i]}));const {data:o}=await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(500);ops=o||[];render();const today=new Date();today.setHours(0,0,0,0);let out=ops.filter(x=>x.type==='out'&&new Date(x.created_at)>=today).reduce((a,x)=>a+x.amount_l,0),inn=ops.filter(x=>x.type==='in'&&new Date(x.created_at)>=today).reduce((a,x)=>a+x.amount_l,0);document.getElementById('outToday').textContent=fa(out)+' L';document.getElementById('inToday').textContent=fa(inn)+' L'}
async function entry(){let opts=tanks.map((t,i)=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');dialog(`<h2>＋ ورود روغن به مخزن</h2><div class="hint">نوع روغن و مقدار ورودی را انتخاب کنید.</div><div class="field"><label>نوع روغن / مخزن</label><select id="ti">${opts}</select></div><div class="field"><label>مقدار ورود (لیتر)</label><input id="ia" type="number" min="1"></div><div class="error" id="er"></div><div class="actions"><button class="cancel" onclick="closeM()">انصراف</button><button class="save" onclick="saveIn()">✓ ثبت ورود</button></div>`)}
async function saveIn(){let id=+document.getElementById('ti').value,a=Number(document.getElementById('ia').value),t=tanks.find(x=>x.id===id),er=document.getElementById('er');if(a<=0){er.textContent='مقدار را وارد کنید.';return}if(t.stock+a>t.capacity){er.textContent='از ظرفیت مخزن بیشتر می‌شود.';return}let {error}=await sb.rpc('record_stock_transaction',{p_tank_id:id,p_type:'in',p_amount_l:a,p_operator:'ورود انبار',p_equipment:null});if(error){er.textContent=error.message;return}closeM();load()}
async function withdraw(index=0){let opts=tanks.map((t,i)=>`<option value="${t.id}" ${i===index?'selected':''}>${esc(t.name)} — ${fa(t.stock)} لیتر</option>`).join('');dialog(`<h2>ثبت برداشت از مخزن</h2><div class="hint">تاریخ و ساعت خودکار ثبت می‌شود.</div><div class="field"><label>مخزن</label><select id="wi">${opts}</select></div><div class="field"><label>نام اپراتور</label><input id="op"></div><div class="field"><label>کد تجهیز</label><input id="eq"></div><div class="field"><label>میزان برداشت (لیتر)</label><input id="wa" type="number" min="1"></div><div class="error" id="er"></div><div class="actions"><button class="cancel" onclick="closeM()">انصراف</button><button class="save" onclick="saveOut()">✓ ثبت برداشت</button></div>`)}
async function saveOut(){let id=+document.getElementById('wi').value,a=Number(document.getElementById('wa').value),op=document.getElementById('op').value.trim(),eq=document.getElementById('eq').value.trim(),er=document.getElementById('er'),t=tanks.find(x=>x.id===id);if(!op||!eq||a<=0){er.textContent='اطلاعات را کامل وارد کنید.';return}if(a>t.stock){er.textContent='موجودی کافی نیست.';return}let {error}=await sb.rpc('record_stock_transaction',{p_tank_id:id,p_type:'out',p_amount_l:a,p_operator:op,p_equipment:eq});if(error){er.textContent=error.message;return}closeM();load()}

let auditOps=[], auditEquip=[], auditIns=[], auditCats=[], selectedPhotoFile=null, auditCategoryFilter=null;

function starHTML(score){
  if(score===null || score===undefined || isNaN(score)) return '<span class="star off">☆☆☆☆☆</span>';
  let n=Math.max(0,Math.min(5,Math.round(Number(score)/20)));
  return '<span class="star">'+'★'.repeat(n)+'</span><span class="star off">'+'☆'.repeat(5-n)+'</span>';
}
function auditScore(inspections){
  if(!inspections.length) return null;
  const weights={'نظافت بدنه':5,'نظافت اطراف':5,'عدم بررسی':20,'چک روغن':8,'خرابی آب صابون':10,'نشتی':12,'خرابی تجهیز':15,'سایر':10};
  let penalty=0;
  inspections.forEach(x=>(x.nonconformities||[]).forEach(n=>penalty+=(weights[n.type||n]||10)));
  return Math.max(0,Math.min(100,100-(penalty/inspections.length)));
}
async function loadAudit(){
  const [op,equip,cats,ins,nc]=await Promise.all([
    sb.from('audit_operators').select('*').eq('active',true).order('name'),
    sb.from('audit_equipment').select('*').eq('active',true).order('code'),
    sb.from('audit_categories').select('*').eq('active',true).order('sort_order').order('name'),
    sb.from('audit_inspections').select('*').order('created_at',{ascending:false}).limit(2000),
    sb.from('audit_nonconformities').select('*')
  ]);
  if(op.error||equip.error||cats.error||ins.error||nc.error){
    const er=op.error||equip.error||cats.error||ins.error||nc.error;
    dialog(`<h2>راه‌اندازی بخش بازرسی</h2><div class="error">${esc(er.message)}</div><div class="hint">ابتدا فایل SQL همراه نسخه جدید را در Supabase اجرا کنید.</div><div class="actions"><button class="cancel" onclick="closeM()">بستن</button></div>`);
    return false;
  }
  auditOps=op.data||[]; auditEquip=equip.data||[]; auditCats=cats.data||[];
  const ncs=nc.data||[];
  auditIns=(ins.data||[]).map(x=>({...x,nonconformities:ncs.filter(n=>n.inspection_id===x.id).map(n=>({id:n.id,type:n.type}))}));
  return true;
}

async function saveAudit(equipmentId){
  const e=auditEquip.find(x=>x.id===equipmentId), o=auditOps.find(x=>x.id===e.operator_id);
  const err=document.getElementById('auditErr'), note=document.getElementById('auditNote').value.trim();
  let ncs=[...document.querySelectorAll('#ncArea input:checked')].map(x=>x.value);
  if(window.auditResult==='nc'&&!ncs.length){err.textContent='حداقل یک عدم انطباق را انتخاب کنید.';return}
  let photo_url=null;
  if(selectedPhotoFile){
    const ext=(selectedPhotoFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${o.id}/${e.id}/${Date.now()}.${ext||'jpg'}`;
    const up=await sb.storage.from('inspection-photos').upload(path,selectedPhotoFile,{upsert:false,contentType:selectedPhotoFile.type||'image/jpeg'});
    if(up.error){err.textContent='آپلود عکس انجام نشد: '+up.error.message;return}
    photo_url=sb.storage.from('inspection-photos').getPublicUrl(path).data.publicUrl;
  }
  const ins={equipment_id:e.id,operator_id:o.id,result:window.auditResult,note,photo_url};
  const {data,error}=await sb.from('audit_inspections').insert(ins).select().single();
  if(error){err.textContent='ثبت بازرسی انجام نشد: '+error.message;return}
  if(!data?.id){err.textContent='ثبت بازرسی انجام نشد: شناسه بازرسی دریافت نشد.';return}
  if(ncs.length){const r=await sb.from('audit_nonconformities').insert(ncs.map(type=>({inspection_id:data.id,type})));if(r.error){err.textContent='بازرسی ثبت شد اما ثبت عدم انطباق انجام نشد: '+r.error.message;return}}
  await loadAudit(); auditOperator(o.id);
}

async function auditDeleteCategory(id){const count=auditEquip.filter(e=>e.category_id===id).length;if(count){alert('این دسته هنوز '+fa(count)+' تجهیز دارد. ابتدا دسته تجهیزات را تغییر بده.');return}if(!confirm('این دسته حذف شود؟'))return;const {error}=await sb.from('audit_categories').update({active:false}).eq('id',id);if(error){alert(error.message);return}await loadAudit();auditCategories()}

async function auditAddOperator(){
  dialog(`<h2>＋ افزودن اپراتور</h2><div class="field"><label>نام و نام خانوادگی</label><input id="newOp"></div><div class="error" id="ae"></div><div class="actions"><button class="cancel" onclick="auditHome()">انصراف</button><button class="save" onclick="saveAuditOperator()">ثبت</button></div>`);
}
async function saveAuditOperator(){
  const name=document.getElementById('newOp').value.trim(),er=document.getElementById('ae');if(!name){er.textContent='نام را وارد کنید.';return}
  const {error}=await sb.from('audit_operators').insert({name});if(error){er.textContent=error.message;return}await loadAudit();auditOperators();
}
async function auditDeleteOperator(id){
  const o=auditOps.find(x=>x.id===id);
  if(!o)return;
  const equipmentCount=auditEquip.filter(e=>e.operator_id===id).length;
  if(equipmentCount){alert(`اپراتور «${o.name}» هنوز مسئول ${fa(equipmentCount)} تجهیز است. ابتدا مسئول تجهیزات را تغییر دهید.`);return}
  if(!confirm(`اپراتور «${o.name}» حذف شود؟\nسوابق بازرسی او حفظ می‌شود، اما نام اپراتور از سوابق جدا خواهد شد.`))return;
  const {error}=await sb.from('audit_operators').delete().eq('id',id);
  if(error){alert(error.message);return}
  await loadAudit();
  auditOperators();
}
async function auditAddEquipment(){
  if(!auditOps.length || !auditCats.length) await loadAudit();
  dialog(`<h2>＋ افزودن تجهیز</h2><div class="field"><label>کد تجهیز</label><input id="newEqCode" placeholder="مثلاً 101"></div><div class="field"><label>نام تجهیز</label><input id="newEqName"></div><div class="field"><label>دسته تجهیز</label><select id="newEqCat">${auditCats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>اپراتور مسئول</label><select id="newEqOp">${auditOps.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="error" id="ae"></div><div class="actions"><button class="cancel" onclick="auditEquipment()">انصراف</button><button class="save" onclick="saveAuditEquipment()">ثبت</button></div>`);
}
async function saveAuditEquipment(){
  const code=document.getElementById('newEqCode').value.trim(),name=document.getElementById('newEqName').value.trim(),category_id=document.getElementById('newEqCat').value,operator_id=document.getElementById('newEqOp').value,er=document.getElementById('ae');

}
async function auditEditEquipment(id){
  const e=auditEquip.find(x=>x.id===id); if(!e)return;
  dialog(`<h2>✏️ ویرایش تجهیز ${esc(e.code)}</h2><div class="field"><label>کد تجهیز</label><input id="newEqCode" value="${esc(e.code)}"></div><div class="field"><label>نام تجهیز</label><input id="newEqName" value="${esc(e.name||'')}"></div><div class="field"><label>دسته تجهیز</label><select id="newEqCat">${auditCats.map(c=>`<option value="${c.id}" ${c.id===e.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>اپراتور مسئول</label><select id="newEqOp">${auditOps.map(o=>`<option value="${o.id}" ${o.id===e.operator_id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div class="error" id="ae"></div><div class="actions"><button class="cancel" onclick="auditEquipment('${e.category_id||''}')">انصراف</button><button class="save" onclick="updateAuditEquipment('${e.id}')">ذخیره</button></div>`);
}
async function updateAuditEquipment(id){
  const code=document.getElementById('newEqCode').value.trim(),name=document.getElementById('newEqName').value.trim(),category_id=document.getElementById('newEqCat').value,operator_id=document.getElementById('newEqOp').value,er=document.getElementById('ae');
  if(!code||!category_id||!operator_id){er.textContent='کد تجهیز، دسته و اپراتور را وارد کنید.';return}
  const {error}=await sb.from('audit_equipment').update({code,name,category_id,operator_id}).eq('id',id);if(error){er.textContent=error.message;return}await loadAudit();auditEquipment(category_id);
}

async function auditRanking(){
  if(!auditOps.length) await loadAudit();
  const rows=auditOps.map(o=>{const ins=auditIns.filter(x=>x.operator_id===o.id),score=auditScore(ins),nc=ins.reduce((a,x)=>a+(x.nonconformities||[]).length,0);return {o,ins,score,nc}}).sort((a,b)=>(b.score??-1)-(a.score??-1));
  dialog(`<h2>🏆 عملکرد اپراتورها</h2><div class="hint">امتیاز بر اساس تعداد و شدت عدم انطباق‌های ثبت‌شده محاسبه می‌شود. امتیاز ۱۰۰٪ بهترین وضعیت است.</div>
  ${rows.map((x,i)=>`<div class="person-row"><div class="person-main"><div class="person-name">${i<3?['🥇','🥈','🥉'][i]+' ':''}${esc(x.o.name)}</div><div class="person-sub">${fa(x.ins.length)} بازرسی · ${fa(x.nc)} عدم انطباق</div></div><div>${starHTML(x.score)} <b>${x.score===null?'—':fa(x.score.toFixed(0))+'٪'}</b></div></div>`).join('')||'<div class="empty">اطلاعاتی وجود ندارد.</div>'}
  <div class="actions"><button class="cancel" onclick="auditHome()">بازگشت</button></div>`);
}
async function auditDeleteNC(ncId){
  if(!ncId)return;
  if(!confirm('این عدم انطباق حذف شود؟\nاین عمل فقط همین مورد را حذف می‌کند و خودِ بازرسی باقی می‌ماند.'))return;
  const {error}=await sb.from('audit_nonconformities').delete().eq('id',ncId);
  if(error){alert('حذف عدم انطباق انجام نشد: '+error.message);return}
  await loadAudit();
  auditHistory();
}
async function auditHistory(){
  if(!auditIns.length) await loadAudit();
  const rows=auditIns.slice(0,150).map(x=>{
    const e=auditEquip.find(z=>z.id===x.equipment_id),o=auditOps.find(z=>z.id===x.operator_id);
    const ncList=(x.nonconformities||[]).map(n=>`<span style="display:inline-flex;align-items:center;gap:5px;margin:2px;padding:4px 7px;border:1px solid #6f2937;border-radius:8px;background:#321820;color:#ffb1bc">${esc(n.type)} <button type="button" title="حذف این عدم انطباق" onclick="auditDeleteNC('${n.id}')" style="border:0;background:transparent;color:#ff7f8f;cursor:pointer;font-size:14px;line-height:1;padding:0">×</button></span>`).join('');
    const result=x.result==='ok'?'🟢 بدون مشکل':`🔴 ${ncList||'<span style="color:#ffb1bc">عدم انطباق</span>'}`;
    return `<tr><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td><td>${esc(e?.code||'—')}</td><td>${esc(o?.name||'—')}</td><td>${result}</td><td>${x.photo_url?`<a href="${x.photo_url}" target="_blank">📷</a>`:'—'}</td></tr>`
  }).join('');
  dialog(`<h2>📋 تاریخچه بازرسی</h2><div class="hint">برای اصلاح اشتباه، روی × کنار هر عدم انطباق بزنید؛ خودِ بازرسی حذف نمی‌شود.</div><div style="overflow:auto"><table class="table"><thead><tr><th>تاریخ</th><th>تجهیز</th><th>اپراتور</th><th>نتیجه / عدم انطباق</th><th>عکس</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">هنوز بازرسی ثبت نشده است.</td></tr>'}</tbody></table></div><div class="actions"><button class="cancel" onclick="auditHome()">بازگشت</button></div>`);
}

function printReport(){let area=document.getElementById('printArea');if(!area){alert('ابتدا یک گزارش را انتخاب کنید.');return}let w=window.open('','_blank');if(!w){alert('پنجره چاپ توسط مرورگر مسدود شده است.');return}let styles=[...document.querySelectorAll('style')].map(s=>s.innerHTML).join('\n');w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${window.reportType==='out'?'گزارش برداشت روغن':'گزارش ورود روغن'}</title><style>${styles}body{background:#fff!important;color:#111!important;font-family:Tahoma,Arial,sans-serif}#printArea{width:100%;padding:10px}#printArea *{visibility:visible!important}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #aaa!important;padding:8px;text-align:right}.table th{background:#eee!important}.kpi{border:1px solid #999!important;padding:10px;background:#fff!important}.kpi .label,.kpi .value{color:#111!important}.print-title{font-size:22px;font-weight:bold;margin-bottom:7px}.print-meta{font-size:12px;margin-bottom:14px;color:#333}@page{size:A4 portrait;margin:12mm}</style></head><body><div id="printArea">${area.innerHTML}</div><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`);w.document.close()}
function dialog(h){document.getElementById('dialog').innerHTML=h;modal.classList.add('show')}function closeM(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeM()});function tick(){let c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString('fa-IR',{dateStyle:'full',timeStyle:'medium'})}setInterval(tick,1000);tick();
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>سامانه مدیریت و نگهداری و تعمیرات</h1><p>برای ورود، ایمیل و رمز عبور کاربر سامانه را وارد کنید.</p><div class="field"><label>ایمیل</label><input id="em" type="email"></div><div class="field"><label>رمز عبور</label><input id="pw" type="password"></div><div class="error" id="le"></div><button class="save" style="width:100%;padding:11px;border:0;border-radius:10px;font:700 12px Vazirmatn;cursor:pointer" onclick="login()">ورود به سامانه</button></div></div>`}else load()}
async function login(){let e=document.getElementById('em').value,p=document.getElementById('pw').value,r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)document.getElementById('le').textContent='ایمیل یا رمز عبور صحیح نیست.';else load()}
boot();
</script></body></html>
